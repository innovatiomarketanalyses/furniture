async function dec(user,pw){var enc=new TextEncoder(),cred=enc.encode(user.trim().toLowerCase()+":"+pw);

for(var j=0;j<D.w.length&&!raw;j++){try{var wk=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.w[j].s),iterations:D.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
