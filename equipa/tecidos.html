function e64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
async function openWith(raw){var wk=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]),k=null;
for(var j=0;j<D.w.length&&!k;j++){try{k=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.w[j].i)},wk,b(D.w[j].k))}catch(e){k=null}}
